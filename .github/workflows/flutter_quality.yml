name: Flutter quality

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    # Холодный раннер ставит NDK и CMake внутри assembleRelease.
    # На 30 минутах GitHub обрывает шаг, Gradle получает SIGTERM (код 143).
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --coverage
      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Compile release APK
        run: flutter build apk --release --no-pub --obfuscate --split-debug-info=build/app/outputs/symbols
        env:
          # Compile validation only; production builds must use a real ID/signature.
          ORG_GRADLE_PROJECT_allowUnsafeRelease: "true"
