name: payk_ai_cfo_platform
description: "PAYK mobile"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_tabler_icons: ^1.43.0
  go_router: ^17.3.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.0
  local_auth: ^3.0.1
  equatable: ^2.0.8
  intl: ^0.20.2
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.6
  share_plus: 12.0.2
  file_picker: 10.3.10
  mobile_scanner: ^7.1.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/banks/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon_master.png"
  min_sdk_android: 21
  adaptive_icon_background: "#362CD1"
  adaptive_icon_foreground: "assets/images/payk_white_badge.png"
